    <style>
        @keyframes appear {
            from {
                opacity: 0;
                scale: 0.3;
            }

            to {
                opacity: 1;
                scale: 1;
            }
        }

        .animateIntoView {
            height: 200px;
            animation: appear linear;
            animation-timeline: view();
            animation-range: entry 0% cover 40%;
        }

        body {
            margin-bottom: 250px;
        }
    </style>
</head>
